name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write

jobs:
  # Тег может указывать на коммит из любой ветки. Релизы собираем только
  # с main — dev и остальные ветки не должны запускать сборку.
  guard:
    runs-on: ubuntu-latest
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Проверить, что тег указывает на main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on-main=true" >> $GITHUB_OUTPUT
          else
            echo "Тег указывает не на main — релиз пропущен."
            echo "on-main=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: guard
    if: needs.guard.outputs['on-main'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # settings.gradle.kts подключает дизайн-кит как composite build из ../SUI.
      # actions/checkout не умеет писать за пределы workspace, поэтому клонируем
      # SUI вручную рядом с рабочим каталогом.
      - name: Checkout дизайн-кита SUI
        run: git clone --depth 1 https://github.com/StrelaTech/SUI.git "${{ github.workspace }}/../SUI"

      - name: Установить Android SDK и NDK
        uses: android-actions/setup-android@v4
        with:
          sdk-version: "37.0"
          build-tools-version: "36.0.0"
          ndk-version: "29.0.14206865"

      - name: Диагностика Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          for sdk in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" "/usr/local/lib/android/sdk"; do
            [ -z "$sdk" ] && continue
            echo "=== $sdk ==="
            [ -d "$sdk/ndk" ] && echo "ndk/: $(ls "$sdk/ndk/" 2>/dev/null)" || echo "ndk/: absent"
            [ -d "$sdk/ndk-bundle" ] && echo "ndk-bundle: present" || echo "ndk-bundle: absent"
          done

      - name: Найти и экспортировать ANDROID_NDK_HOME
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            NDK_DIR=""
            for sdk in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" "/usr/local/lib/android/sdk"; do
              [ -z "$sdk" ] && continue
              if [ -d "$sdk/ndk" ]; then
                NDK_DIR="$(ls -d "$sdk/ndk"/* 2>/dev/null | sort -V | tail -1)"
                [ -n "$NDK_DIR" ] && break
              fi
              if [ -d "$sdk/ndk-bundle" ]; then
                NDK_DIR="$sdk/ndk-bundle"
                break
              fi
            done
            if [ -z "$NDK_DIR" ]; then
              echo "NDK не найден, устанавливаю через sdkmanager..."
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" >/dev/null 2>&1
              NDK_DIR="$(ls -d "$ANDROID_HOME/ndk"/* 2>/dev/null | sort -V | tail -1)"
              [ -z "$NDK_DIR" ] && NDK_DIR="$ANDROID_HOME/ndk-bundle"
            fi
            if [ -z "$NDK_DIR" ]; then
              echo "NDK не найден"; exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          fi
          echo "Using NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Установить JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Получить версию из тега
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT

      - name: Подготовить keystore для подписи релиза
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SIGNED=false
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ПРЕДУПРЕЖДЕНИЕ: секреты подписи не заданы (KEYSTORE_BASE64 и т.д.)."
            echo "Релиз будет собран без подписи — не подходит для публикации в магазин."
          else
            if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > onebox-release.jks 2>/dev/null || [ ! -s onebox-release.jks ]; then
              rm -f onebox-release.jks
              echo "::error::KEYSTORE_BASE64 не является корректным base64. Проверьте секрет."
              exit 1
            fi

            echo "Размер декодированного keystore: $(wc -c < onebox-release.jks) байт"

            # Обрезанный base64 тоже декодируется «успешно», но keystore
            # получается битым, и Gradle падает позже на :app:packageRelease
            # с KeytoolException: ... : null. Проверяем, что файл читается.
            if ! STORE_OUT="$(keytool -list -keystore onebox-release.jks -storepass "$KEYSTORE_PASSWORD" 2>&1)"; then
              echo "$STORE_OUT"
              if printf '%s' "$STORE_OUT" | grep -qiE 'password was incorrect|tampered|password verification failed'; then
                echo "::error::KEYSTORE_PASSWORD не подходит к KEYSTORE_BASE64 (либо KEYSTORE_BASE64 повреждён)."
              else
                echo "::error::KEYSTORE_BASE64 повреждён или обрезан (файл не читается как keystore). Пересоздайте секрет целиком: base64 -w0 onebox-release.jks"
              fi
              exit 1
            fi

            if ! keytool -list -keystore onebox-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::KEY_ALIAS '$KEY_ALIAS' не найден в KEYSTORE_BASE64. Проверьте alias: keytool -list -keystore onebox-release.jks"
              exit 1
            fi

            # Пароль ключа хранится отдельно от пароля хранилища — проверяем и его.
            # -srcstoretype JKS заставляет keytool проверить именно KEY_PASSWORD
            # (для PKCS12 без него проверяется только пароль хранилища).
            if ! keytool -importkeystore \
                -srckeystore onebox-release.jks -srcstoretype JKS -srcalias "$KEY_ALIAS" \
                -srcstorepass "$KEYSTORE_PASSWORD" -srckeypass "$KEY_PASSWORD" \
                -destkeystore /tmp/keystore-check.p12 -deststoretype PKCS12 \
                -deststorepass checkpass -destkeypass checkpass -noprompt >/dev/null 2>&1; then
              echo "::error::KEY_PASSWORD не подходит к ключу '$KEY_ALIAS' в KEYSTORE_BASE64."
              exit 1
            fi
            rm -f /tmp/keystore-check.p12

            {
              echo "storeFile=onebox-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            SIGNED=true
          fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Собрать подписанный релиз (APK по архитектурам + универсальный)
        run: ./gradlew assembleRelease --no-daemon

      - name: Проверить, что в каждом APK своё ядро
        run: |
          fail=0
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            name="$(basename "$apk")"
            cores="$(unzip -l "$apk" | awk '/lib\/[^/]+\/libgojni\.so$/ {print $4}' | sort)"
            count="$(printf '%s\n' "$cores" | grep -c . || true)"
            echo "=== $name ==="
            printf '%s\n' "$cores"
            if printf '%s' "$name" | grep -q -- '-universal-'; then
              [ "$count" -eq 3 ] || { echo "::error::$name должен содержать ядра для трёх ABI, найдено: $count"; fail=1; }
            else
              [ "$count" -eq 1 ] || { echo "::error::$name должен содержать ровно одно нативное ядро, найдено: $count"; fail=1; }
            fi
          done
          exit "$fail"

      - name: Подготовить файлы релиза и контрольные суммы
        id: release-files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist

          # AGP при splits.abi выпускает app-<abi>-release.apk и
          # app-universal-release.apk. Имя определяем по ABI в имени файла,
          # чтобы не зависеть от порядка сборки.
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            case "$(basename "$apk")" in
              *-universal-*)  arch=universal ;;
              *-armeabi-v7a-*) arch=armeabi-v7a ;;
              *-arm64-v8a-*)  arch=arm64-v8a ;;
              *-x86_64-*)     arch=x86_64 ;;
              *)              arch="" ;;
            esac
            if [ -n "$arch" ]; then
              cp "$apk" "dist/OneBox-${VERSION}-${arch}.apk"
            else
              # Fallback для сборок без splits.
              cp "$apk" "dist/OneBox-${VERSION}.apk"
            fi
          done

          test -n "$(ls dist/*.apk 2>/dev/null)" || { echo "::error::APK не найдены"; exit 1; }

          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION}.txt"

          cd dist
          sha256sum *.apk "mapping-${VERSION}.txt" > "SHA256SUMS.txt"
          echo "mapping=dist/mapping-${VERSION}.txt" >> $GITHUB_OUTPUT
          echo "checksums=dist/SHA256SUMS.txt" >> $GITHUB_OUTPUT

      - name: Загрузить артефакты релиза
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30

      - name: Опубликовать GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OneBox ${{ steps.version.outputs.version }}
          body: |
            Сборка из тега `${{ github.ref_name }}`.
            Версия: `${{ steps.version.outputs.version }}`

            APK по архитектурам (в каждом только своё нативное ядро xray):
            `OneBox-${{ steps.version.outputs.version }}-armeabi-v7a.apk`,
            `OneBox-${{ steps.version.outputs.version }}-arm64-v8a.apk`,
            `OneBox-${{ steps.version.outputs.version }}-x86_64.apk`.
            Универсальный APK со всеми тремя ядрами:
            `OneBox-${{ steps.version.outputs.version }}-universal.apk`.
          files: |
            dist/OneBox-${{ steps.version.outputs.version }}*.apk
            dist/mapping-${{ steps.version.outputs.version }}.txt
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
