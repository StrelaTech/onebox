name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # settings.gradle.kts подключает дизайн-кит как composite build из ../SUI.
      # actions/checkout не умеет писать за пределы workspace, поэтому клонируем
      # SUI вручную рядом с рабочим каталогом.
      - name: Checkout дизайн-кита SUI
        run: git clone --depth 1 https://github.com/StrelaTech/SUI.git "${{ github.workspace }}/../SUI"

      - name: Установить Android SDK и NDK
        uses: android-actions/setup-android@v4
        with:
          sdk-version: "37.0"
          build-tools-version: "36.0.0"
          ndk-version: "29.0.14206865"

      - name: Найти и экспортировать ANDROID_NDK_HOME
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            NDK_DIR=""
            for sdk in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" "/usr/local/lib/android/sdk"; do
              [ -z "$sdk" ] && continue
              if [ -d "$sdk/ndk" ]; then
                NDK_DIR="$(ls -d "$sdk/ndk"/* 2>/dev/null | sort -V | tail -1)"
                [ -n "$NDK_DIR" ] && break
              fi
              if [ -d "$sdk/ndk-bundle" ]; then
                NDK_DIR="$sdk/ndk-bundle"
                break
              fi
            done
            if [ -z "$NDK_DIR" ]; then
              echo "NDK не найден, устанавливаю через sdkmanager..."
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" >/dev/null 2>&1
              NDK_DIR="$(ls -d "$ANDROID_HOME/ndk"/* 2>/dev/null | sort -V | tail -1)"
              [ -z "$NDK_DIR" ] && NDK_DIR="$ANDROID_HOME/ndk-bundle"
            fi
            if [ -z "$NDK_DIR" ]; then
              echo "NDK не найден"; exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          fi
          echo "Using NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Установить JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Сокращённый набор тестов: только быстрые тесты парсинга подписок.
      # Полный прогон и lint выполняются локально перед релизом.
      - name: Быстрые unit-тесты
        run: ./gradlew :core-parsing:testDebugUnitTest --no-daemon

      - name: Подготовить keystore для подписи релиза
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SIGNED=false
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ПРЕДУПРЕЖДЕНИЕ: секреты подписи не заданы (KEYSTORE_BASE64 и т.д.)."
            echo "Релиз будет собран без подписи — не подходит для публикации в магазин."
          else
            if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > onebox-release.jks 2>/dev/null || [ ! -s onebox-release.jks ]; then
              rm -f onebox-release.jks
              echo "::error::KEYSTORE_BASE64 не является корректным base64. Проверьте секрет."
              exit 1
            fi

            echo "Размер декодированного keystore: $(wc -c < onebox-release.jks) байт"

            # Обрезанный base64 тоже декодируется «успешно», но keystore
            # получается битым, и Gradle падает позже на :app:packageRelease
            # с KeytoolException: ... : null. Проверяем, что файл читается.
            if ! STORE_OUT="$(keytool -list -keystore onebox-release.jks -storepass "$KEYSTORE_PASSWORD" 2>&1)"; then
              echo "$STORE_OUT"
              if printf '%s' "$STORE_OUT" | grep -qiE 'password was incorrect|tampered|password verification failed'; then
                echo "::error::KEYSTORE_PASSWORD не подходит к KEYSTORE_BASE64 (либо KEYSTORE_BASE64 повреждён)."
              else
                echo "::error::KEYSTORE_BASE64 повреждён или обрезан (файл не читается как keystore). Пересоздайте секрет целиком: base64 -w0 onebox-release.jks"
              fi
              exit 1
            fi

            if ! keytool -list -keystore onebox-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::KEY_ALIAS '$KEY_ALIAS' не найден в KEYSTORE_BASE64. Проверьте alias: keytool -list -keystore onebox-release.jks"
              exit 1
            fi

            # Пароль ключа хранится отдельно от пароля хранилища — проверяем и его.
            # -srcstoretype JKS заставляет keytool проверить именно KEY_PASSWORD
            # (для PKCS12 без него проверяется только пароль хранилища).
            if ! keytool -importkeystore \
                -srckeystore onebox-release.jks -srcstoretype JKS -srcalias "$KEY_ALIAS" \
                -srcstorepass "$KEYSTORE_PASSWORD" -srckeypass "$KEY_PASSWORD" \
                -destkeystore /tmp/keystore-check.p12 -deststoretype PKCS12 \
                -deststorepass checkpass -destkeypass checkpass -noprompt >/dev/null 2>&1; then
              echo "::error::KEY_PASSWORD не подходит к ключу '$KEY_ALIAS' в KEYSTORE_BASE64."
              exit 1
            fi
            rm -f /tmp/keystore-check.p12

            {
              echo "storeFile=onebox-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            SIGNED=true
          fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Собрать release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Определить последний тег
        id: tag
        run: |
          git fetch --tags --force
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          if [ -n "$TAG" ]; then
            echo "sha=$(git rev-list -n1 "$TAG")" >> $GITHUB_OUTPUT
          else
            echo "sha=" >> $GITHUB_OUTPUT
          fi
          if [ -z "$TAG" ]; then
            echo "Тегов нет — бинарники будут только в артефактах Actions."
          else
            echo "Бинарники будут привязаны к тегу $TAG"
          fi

      - name: Подготовить файлы релиза и контрольные суммы
        id: release-files
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p dist

          for apk in app/build/outputs/apk/release/app-release-*.apk; do
            [ -f "$apk" ] || continue
            arch=$(basename "$apk" | sed -E 's/app-release-(.+)\.apk/\1/')
            cp "$apk" "dist/OneBox-${VERSION}-${arch}.apk"
          done

          if [ -z "$(ls dist/*.apk 2>/dev/null)" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/OneBox-${VERSION}.apk"
          fi

          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION}.txt"
          cd dist
          sha256sum *.apk "mapping-${VERSION}.txt" > "SHA256SUMS.txt"

      - name: Загрузить артефакты сборки
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7

      - name: Привязать бинарники к последнему тегу
        if: steps.tag.outputs.tag != '' && steps.tag.outputs.sha != github.sha
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OneBox ${{ steps.tag.outputs.version }}
          body: |
            Сборка из `main` для тега `${{ steps.tag.outputs.tag }}`.
            Коммит: `${{ github.sha }}`

            APK по архитектурам: `armeabi-v7a`, `arm64-v8a`, `x86_64`.
          files: |
            dist/OneBox-${{ steps.tag.outputs.version }}*.apk
            dist/mapping-${{ steps.tag.outputs.version }}.txt
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
