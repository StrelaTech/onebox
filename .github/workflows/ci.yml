name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Установить Android SDK и NDK
        uses: android-actions/setup-android@v4
        with:
          sdk-version: "37.0"
          build-tools-version: "36.0.0"
          ndk-version: "29.0.14206865"

      - name: Установить Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: xray/go.sum

      - name: Установить JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Собрать xray.aar (gomobile bind)
        run: ./scripts/build-xray-aar.sh
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Кэш локального Maven-репозитория (xray.aar)
        if: always()
        uses: actions/cache@v6
        with:
          path: local-maven
          key: ${{ runner.os }}-xray-aar-${{ hashFiles('xray/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-xray-aar-

      - name: Unit-тесты
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Собрать debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Загрузить debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
